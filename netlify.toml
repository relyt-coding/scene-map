[build]
  publish = "web"

[[headers]]
  for = "/data/places.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/data/titles.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/data/details/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/data/links/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
